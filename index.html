  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#2f6bff;margin-bottom:16px\">01 \u2014 El congreso<\u002Fdiv>\n      <h2 style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(32px,4vw,52px);line-height:1.05;letter-spacing:-0.03em;margin:0 0 26px\">\u00bfQu\u00e9 es <span style=\"background:linear-gradient(90deg,#2f6bff,#19c6e6);-webkit-background-clip:text;background-clip:text;color:transparent\">AIEthics<\u002Fspan>?<\u002Fh2>\n      <div style=\"font-size:18px;line-height:1.7;color:#3b3f68;display:flex;flex-direction:column;gap:18px;text-wrap:pretty\">\n        <p style=\"margin:0\">El <strong style=\"color:#14163f\">III Congreso AIETHICS<\u002Fstrong> es un espacio de encuentro entre profesionales de la comunicaci\u00f3n y la informaci\u00f3n, en su sentido m\u00e1s amplio, para debatir sobre la necesidad de establecer <strong style=\"color:#2f6bff\">l\u00edmites \u00e9ticos al uso de la inteligencia artificial<\u002Fstrong>.<\u002Fp>\n        <p style=\"margin:0\">Se articula como un lugar para analizar las posibilidades que ofrece hoy la IA en el \u00e1mbito de la comunicaci\u00f3n y los grandes retos a los que se enfrentan las profesiones del sector, tanto desde la pr\u00e1ctica profesional como desde la industria.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;border-radius:28px;min-height:400px;overflow:hidden;background:linear-gradient(135deg,#2f6bff,#19c6e6)\">\n      <div style=\"position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.14) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.14) 1px,transparent 1px);background-size:40px 40px\"><\u002Fdiv>\n      <div style=\"position:absolute;inset:18px;border-radius:20px;background:radial-gradient(circle at 50% 50%,#ffffff,#e6f1fd 70%);overflow:hidden;display:flex;align-items:center;justify-content:center\">{{ ring }}<\u002Fdiv>\n      <div style=\"position:absolute;top:-30px;right:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,0.18)\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Claves\" style=\"position:relative;padding:80px 28px;background:linear-gradient(110deg,#2246d6 0%,#2f6bff 45%,#19c6e6 100%);overflow:hidden\">\n  <div style=\"position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.22) 1px,transparent 1px);background-size:22px 22px;opacity:.6\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:1240px;margin:0 auto\">\n    <h2 style=\"font-family:'Sora',sans-serif;font-weight:600;font-size:clamp(26px,3vw,36px);letter-spacing:-0.02em;margin:0 0 36px;text-align:center\">Las claves del congreso<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px\">\n      <a href=\"#lineas\" style=\"background:rgba(17,18,58,0.28);border:1px solid rgba(255,255,255,0.35);border-radius:20px;padding:26px 22px;color:#ffffff;display:flex;flex-direction:column;gap:18px;backdrop-filter:blur(6px)\" style-hover=\"background:rgba(17,18,58,0.5);color:#ffffff\"><span style=\"width:48px;height:48px;border-radius:14px;background:#ffffff;color:#2f6bff;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;font-size:18px\">01<\u002Fspan><span style=\"font-family:'Sora',sans-serif;font-size:19px;font-weight:600;line-height:1.25\">Periodismo<\u002Fspan><\u002Fa>\n      <a href=\"#lineas\" style=\"background:rgba(17,18,58,0.28);border:1px solid rgba(255,255,255,0.35);border-radius:20px;padding:26px 22px;color:#ffffff;display:flex;flex-direction:column;gap:18px;backdrop-filter:blur(6px)\" style-hover=\"background:rgba(17,18,58,0.5);color:#ffffff\"><span style=\"width:48px;height:48px;border-radius:14px;background:#ffffff;color:#2f6bff;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;font-size:18px\">02<\u002Fspan><span style=\"font-family:'Sora',sans-serif;font-size:19px;font-weight:600;line-height:1.25\">Comunicaci\u00f3n audiovisual<\u002Fspan><\u002Fa>\n      <a href=\"#lineas\" style=\"background:rgba(17,18,58,0.28);border:1px solid rgba(255,255,255,0.35);border-radius:20px;padding:26px 22px;color:#ffffff;display:flex;flex-direction:column;gap:18px;backdrop-filter:blur(6px)\" style-hover=\"background:rgba(17,18,58,0.5);color:#ffffff\"><span style=\"width:48px;height:48px;border-radius:14px;background:#ffffff;color:#2f6bff;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;font-size:18px\">03<\u002Fspan><span style=\"font-family:'Sora',sans-serif;font-size:19px;font-weight:600;line-height:1.25\">Publicidad<\u002Fspan><\u002Fa>\n      <a href=\"#lineas\" style=\"background:rgba(17,18,58,0.28);border:1px solid rgba(255,255,255,0.35);border-radius:20px;padding:26px 22px;color:#ffffff;display:flex;flex-direction:column;gap:18px;backdrop-filter:blur(6px)\" style-hover=\"background:rgba(17,18,58,0.5);color:#ffffff\"><span style=\"width:48px;height:48px;border-radius:14px;background:#ffffff;color:#2f6bff;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;font-size:18px\">04<\u002Fspan><span style=\"font-family:'Sora',sans-serif;font-size:19px;font-weight:600;line-height:1.25\">Relaciones p\u00fablicas<\u002Fspan><\u002Fa>\n      <a href=\"#lineas\" style=\"background:rgba(17,18,58,0.28);border:1px solid rgba(255,255,255,0.35);border-radius:20px;padding:26px 22px;color:#ffffff;display:flex;flex-direction:column;gap:18px;backdrop-filter:blur(6px)\" style-hover=\"background:rgba(17,18,58,0.5);color:#ffffff\"><span style=\"width:48px;height:48px;border-radius:14px;background:#ffffff;color:#2f6bff;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;font-size:18px\">05<\u002Fspan><span style=\"font-family:'Sora',sans-serif;font-size:19px;font-weight:600;line-height:1.25\">Regulaci\u00f3n y \u00e9tica<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"lineas\" data-screen-label=\"L\u00edneas tem\u00e1ticas\" style=\"position:relative;padding:100px 28px;background:#0e0f30;overflow:hidden\">\n  <div style=\"position:absolute;top:40px;right:-60px;width:420px;height:220px;border-top:2px solid rgba(25,198,230,0.35);border-left:2px solid rgba(25,198,230,0.35);border-radius:40px 0 0 0\"><\u002Fdiv>\n  <div style=\"position:absolute;top:80px;right:-60px;width:340px;height:160px;border-top:2px solid rgba(47,107,255,0.4);border-left:2px solid rgba(47,107,255,0.4);border-radius:30px 0 0 0\"><\u002Fdiv>\n  <div style=\"position:absolute;top:36px;right:354px;width:10px;height:10px;border-radius:50%;background:#19c6e6;box-shadow:0 0 14px #19c6e6\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:1240px;margin:0 auto\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#4fd6f0;margin-bottom:16px\">02 \u2014 Contenidos<\u002Fdiv>\n    <h2 style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(32px,4vw,52px);line-height:1.05;letter-spacing:-0.03em;margin:0 0 48px\">L\u00edneas tem\u00e1ticas<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:28px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ lines }}\" as=\"line\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ line.select }}\" style=\"{{ line.btnStyle }}\">\n            <span style=\"{{ line.numStyle }}\">{{ line.n }}<\u002Fspan>\n            <span style=\"font-family:'Sora',sans-serif;font-size:17px;font-weight:600;line-height:1.3\">{{ line.title }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"grid-column:span 2;min-width:0;border-radius:26px;padding:2px;background:linear-gradient(135deg,#2f6bff,#19c6e6 60%,rgba(25,198,230,0.2))\">\n        <div style=\"border-radius:24px;padding:clamp(26px,4vw,44px);background:linear-gradient(160deg,#1a1d5a,#11123a 60%)\">\n          <div style=\"display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.1em;color:#11123a;background:#4fd6f0;padding:5px 12px;border-radius:999px;margin-bottom:18px\">L\u00cdNEA {{ active.n }}<\u002Fdiv>\n          <h3 style=\"font-family:'Sora',sans-serif;font-size:clamp(24px,2.6vw,34px);font-weight:700;letter-spacing:-0.02em;line-height:1.15;margin:0 0 20px;text-wrap:balance\">{{ active.title }}<\u002Fh3>\n          <p style=\"font-size:17px;line-height:1.7;color:#c8ccf0;margin:0 0 30px;text-wrap:pretty\">{{ active.desc }}<\u002Fp>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#4fd6f0;margin-bottom:12px\">Subtemas<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px\">\n            <sc-for list=\"{{ active.subs }}\" as=\"s\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid;grid-template-columns:10px 1fr;gap:12px;padding:14px 16px;border-radius:14px;background:rgba(47,107,255,0.12);border:1px solid rgba(79,214,240,0.18);font-size:15px;line-height:1.5;color:#eef0ff\"><span style=\"width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,#2f6bff,#19c6e6);margin-top:7px\"><\u002Fspan><span>{{ s }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"participa\" data-screen-label=\"Call for papers\" style=\"padding:100px 28px;background:#f2f5ff;color:#14163f\">\n  <div style=\"max-width:1240px;margin:0 auto\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#2f6bff;margin-bottom:16px\">03 \u2014 Participa<\u002Fdiv>\n    <h2 style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(32px,4vw,52px);line-height:1.05;letter-spacing:-0.03em;margin:0 0 48px\">Call for papers<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:40px\">\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <p style=\"font-size:18px;line-height:1.65;color:#3b3f68;margin:0;text-wrap:pretty\">Invitamos a investigadores, doctorandos y profesionales a presentar comunicaciones originales vinculadas a cualquiera de las cinco l\u00edneas tem\u00e1ticas del congreso.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px\">\n          <div style=\"background:#ffffff;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(47,107,255,0.08);display:flex;flex-direction:column;gap:12px\"><span style=\"width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#2f6bff,#19c6e6);color:#ffffff;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;font-size:15px\">1<\u002Fspan><div style=\"font-size:15px;line-height:1.55;color:#3b3f68\"><strong style=\"color:#14163f;display:block;margin-bottom:2px\">Env\u00eda un resumen<\u002Fstrong>De 300 a 500 palabras desde el \u00e1rea privada, indicando la l\u00ednea tem\u00e1tica.<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#ffffff;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(47,107,255,0.08);display:flex;flex-direction:column;gap:12px\"><span style=\"width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#2f6bff,#19c6e6);color:#ffffff;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;font-size:15px\">2<\u002Fspan><div style=\"font-size:15px;line-height:1.55;color:#3b3f68\"><strong style=\"color:#14163f;display:block;margin-bottom:2px\">Elige publicaci\u00f3n<\u002Fstrong>Indica si optas a revista o editorial y, en su caso, a qu\u00e9 revista.<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#ffffff;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(47,107,255,0.08);display:flex;flex-direction:column;gap:12px\"><span style=\"width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#2f6bff,#19c6e6);color:#ffffff;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;font-size:15px\">3<\u002Fspan><div style=\"font-size:15px;line-height:1.55;color:#3b3f68\"><strong style=\"color:#14163f;display:block;margin-bottom:2px\">Presenta y debate<\u002Fstrong>Tu trabajo en las sesiones del 8 y 9 de abril en M\u00e1laga.<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#ffffff;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(47,107,255,0.08);display:flex;flex-direction:column;gap:12px\"><span style=\"width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#2f6bff,#19c6e6);color:#ffffff;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;font-size:15px\">4<\u002Fspan><div style=\"font-size:15px;line-height:1.55;color:#3b3f68\"><strong style=\"color:#14163f;display:block;margin-bottom:2px\">Entrega el texto<\u002Fstrong>Siguiendo las normas de estilo de la revista elegida.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n          <a href=\"https://areaprivada.portalintracom.com/inscripcion\" style=\"background:linear-gradient(90deg,#2f6bff,#19c6e6);color:#ffffff;padding:15px 26px;border-radius:999px;font-weight:600;font-size:15px;box-shadow:0 10px 26px rgba(47,107,255,0.35)\" style-hover=\"color:#ffffff;box-shadow:0 12px 32px rgba(25,198,230,0.5)\">Env\u00eda tu propuesta<\u002Fa>\n          <a href=\"/guia-de-estilo.pdf\" style=\"background:#11123a;color:#ffffff;padding:15px 26px;border-radius:999px;font-weight:500;font-size:15px\" style-hover=\"background:#2f6bff;color:#ffffff\">Gu\u00eda de estilo (PDF)<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-radius:26px;background:linear-gradient(160deg,#1a1d5a,#11123a);color:#eef0ff;padding:clamp(26px,3.5vw,40px);position:relative;overflow:hidden\">\n        <div style=\"position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(25,198,230,0.45),rgba(25,198,230,0) 70%)\"><\u002Fdiv>\n        <div style=\"position:relative;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#4fd6f0;margin-bottom:28px\">Fechas clave \u00b7 2027<\u002Fdiv>\n        <div style=\"position:relative;display:flex;flex-direction:column\">\n          <div style=\"position:absolute;left:8px;top:10px;bottom:10px;width:2px;background:linear-gradient(180deg,#2f6bff,#19c6e6)\"><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:18px 1fr;gap:22px;padding-bottom:24px;position:relative\"><span style=\"width:18px;height:18px;border-radius:50%;border:3px solid #2f6bff;background:#11123a;margin-top:4px\"><\u002Fspan><div><div style=\"font-family:'Sora',sans-serif;font-size:20px;font-weight:600\">8 de febrero<\u002Fdiv><div style=\"color:#c8ccf0;font-size:15px;margin-top:3px\">Fecha l\u00edmite de env\u00edo de propuestas (resumen)<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:18px 1fr;gap:22px;padding-bottom:24px;position:relative\"><span style=\"width:18px;height:18px;border-radius:50%;border:3px solid #2c82f4;background:#11123a;margin-top:4px\"><\u002Fspan><div><div style=\"font-family:'Sora',sans-serif;font-size:20px;font-weight:600\">15 de febrero<\u002Fdiv><div style=\"color:#c8ccf0;font-size:15px;margin-top:3px\">Comunicaci\u00f3n de las propuestas aceptadas<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:18px 1fr;gap:22px;padding-bottom:24px;position:relative\"><span style=\"width:18px;height:18px;border-radius:50%;border:3px solid #2398ee;background:#11123a;margin-top:4px\"><\u002Fspan><div><div style=\"font-family:'Sora',sans-serif;font-size:20px;font-weight:600\">1 de marzo<\u002Fdiv><div style=\"color:#c8ccf0;font-size:15px;margin-top:3px\">Fin del periodo de inscripci\u00f3n<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:18px 1fr;gap:22px;padding:14px 16px 14px 0;margin:-6px 0 18px;position:relative\"><span style=\"width:18px;height:18px;border-radius:50%;background:#19c6e6;margin-top:4px;box-shadow:0 0 0 6px rgba(25,198,230,0.25),0 0 22px #19c6e6\"><\u002Fspan><div><div style=\"font-family:'Sora',sans-serif;font-size:24px;font-weight:700;color:#4fd6f0\">8 y 9 de abril<\u002Fdiv><div style=\"color:#ffffff;font-size:15px;margin-top:3px\">Celebraci\u00f3n del congreso en M\u00e1laga<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:18px 1fr;gap:22px;position:relative\"><span style=\"width:18px;height:18px;border-radius:50%;border:3px solid #19c6e6;background:#11123a;margin-top:4px\"><\u002Fspan><div><div style=\"font-family:'Sora',sans-serif;font-size:20px;font-weight:600\">19 de abril<\u002Fdiv><div style=\"color:#c8ccf0;font-size:15px;margin-top:3px\">Entrega de los textos completos<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"inscripcion\" data-screen-label=\"Inscripci\u00f3n\" style=\"position:relative;padding:100px 28px;background:linear-gradient(180deg,#11123a 0%,#1b2a8a 55%,#2f6bff 100%);overflow:hidden\">\n  <div style=\"position:absolute;inset:0;background-image:radial-gradient(rgba(140,190,255,0.2) 1px,transparent 1px);background-size:24px 24px\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:1240px;margin:0 auto\">\n    <div style=\"text-align:center;margin-bottom:52px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#4fd6f0;margin-bottom:16px\">04 \u2014 Inscripci\u00f3n<\u002Fdiv>\n      <h2 style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(32px,4vw,52px);line-height:1.05;letter-spacing:-0.03em;margin:0 0 20px\">Modalidades de inscripci\u00f3n<\u002Fh2>\n      <div style=\"display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.08em;background:rgba(25,198,230,0.18);border:1px solid rgba(79,214,240,0.6);color:#ffffff;padding:9px 18px;border-radius:999px\">FECHA L\u00cdMITE \u00b7 1 DE MARZO DE 2027<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px;align-items:stretch\">\n      <div style=\"background:#ffffff;color:#14163f;border-radius:26px;padding:34px 30px;display:flex;flex-direction:column;gap:20px;box-shadow:0 24px 60px rgba(8,10,40,0.35)\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#6a6f99\">Oyente<\u002Fdiv>\n        <div style=\"font-family:'Sora',sans-serif;font-size:48px;font-weight:700;letter-spacing:-0.03em;line-height:1;color:#2f6bff\">30 \u20ac<\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3b3f68;flex:1\">Asistencia a todas las sesiones del congreso. Incluye caf\u00e9s y diploma de asistencia.<\u002Fp>\n        <a href=\"https://areaprivada.portalintracom.com/inscripcion\" style=\"text-align:center;background:#eaf0ff;color:#2f6bff;padding:14px;border-radius:999px;font-weight:600;font-size:15px\" style-hover=\"background:#2f6bff;color:#ffffff\">Inscribirme<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"background:#ffffff;color:#14163f;border-radius:26px;padding:34px 30px;display:flex;flex-direction:column;gap:20px;box-shadow:0 24px 60px rgba(8,10,40,0.35)\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#6a6f99\">B\u00e1sica + Intracom Journal<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\"><span style=\"font-family:'Sora',sans-serif;font-size:48px;font-weight:700;letter-spacing:-0.03em;line-height:1;color:#2f6bff\">150 \u20ac<\u002Fspan><span style=\"font-size:14px;color:#6a6f99\">Investigadores<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\"><span style=\"font-family:'Sora',sans-serif;font-size:30px;font-weight:600;letter-spacing:-0.02em;line-height:1;color:#1aa6d6\">120 \u20ac<\u002Fspan><span style=\"font-size:14px;color:#6a6f99\">Doctorandos<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3b3f68;flex:1\">Presentaci\u00f3n de una comunicaci\u00f3n y publicaci\u00f3n en la revista Intracom Journal.<\u002Fp>\n        <a href=\"https://areaprivada.portalintracom.com/inscripcion\" style=\"text-align:center;background:#eaf0ff;color:#2f6bff;padding:14px;border-radius:999px;font-weight:600;font-size:15px\" style-hover=\"background:#2f6bff;color:#ffffff\">Inscribirme<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"background:linear-gradient(160deg,#2f6bff,#19c6e6);color:#ffffff;border-radius:26px;padding:34px 30px;display:flex;flex-direction:column;gap:20px;box-shadow:0 24px 60px rgba(25,198,230,0.45);position:relative;overflow:hidden\">\n        <div style=\"position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,0.15)\"><\u002Fdiv>\n        <div style=\"position:relative;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#ffffff\">Comunicaci\u00f3n + publicaci\u00f3n indexada<\u002Fspan><\u002Fdiv>\n        <div style=\"position:relative;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\"><span style=\"font-family:'Sora',sans-serif;font-size:48px;font-weight:700;letter-spacing:-0.03em;line-height:1\">250 \u20ac<\u002Fspan><span style=\"font-size:14px;color:#e6f6ff\">Investigadores<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\"><span style=\"font-family:'Sora',sans-serif;font-size:30px;font-weight:600;letter-spacing:-0.02em;line-height:1\">200 \u20ac<\u002Fspan><span style=\"font-size:14px;color:#e6f6ff\">Doctorandos<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"position:relative;margin:0;font-size:15px;line-height:1.6;color:#ffffff;flex:1\">Presentaci\u00f3n de una comunicaci\u00f3n y publicaci\u00f3n en revistas indexadas o en editorial de prestigio, previa evaluaci\u00f3n por pares.<\u002Fp>\n        <a href=\"https://areaprivada.portalintracom.com/inscripcion\" style=\"position:relative;text-align:center;background:#11123a;color:#ffffff;padding:14px;border-radius:999px;font-weight:600;font-size:15px\" style-hover=\"background:#ffffff;color:#2f6bff\">Inscribirme<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;font-size:15px;line-height:1.6;color:#ffffff\">\n      <p style=\"margin:0;padding:18px 22px;border-radius:16px;background:rgba(17,18,58,0.4);text-wrap:pretty\"><strong>Indica en la inscripci\u00f3n<\u002Fstrong> a qu\u00e9 tipo de publicaci\u00f3n optas y, en el caso de las revistas, a cu\u00e1l. Cada aportaci\u00f3n deber\u00e1 seguir las normas de estilo de la revista elegida.<\u002Fp>\n      <p style=\"margin:0;padding:18px 22px;border-radius:16px;background:rgba(17,18,58,0.4);text-wrap:pretty\"><strong>Si un trabajo no supera la evaluaci\u00f3n por pares<\u002Fstrong> de la revista, se publicar\u00e1 en un libro colectivo de editorial de prestigio.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"publicaciones\" data-screen-label=\"Publicaciones\" style=\"padding:100px 28px;background:#ffffff;color:#14163f\">\n  <div style=\"max-width:1240px;margin:0 auto\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#2f6bff;margin-bottom:16px\">05 \u2014 Resultados<\u002Fdiv>\n    <h2 style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(32px,4vw,52px);line-height:1.05;letter-spacing:-0.03em;margin:0 0 18px\">Publicaciones<\u002Fh2>\n    <p style=\"font-size:18px;line-height:1.65;color:#3b3f68;margin:0 0 44px;max-width:720px;text-wrap:pretty\">Los trabajos aceptados podr\u00e1n publicarse en la secci\u00f3n miscel\u00e1nea de las siguientes revistas cient\u00edficas, tras superar su proceso de evaluaci\u00f3n por pares.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px\">\n      <a href=\"https://revistascientificas.us.es/index.php/IROCAMM/subs\" style=\"border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:34px;color:#14163f;background:#f2f5ff;border:1px solid #dfe6ff\" style-hover=\"border-color:#2f6bff;color:#14163f;box-shadow:0 14px 34px rgba(47,107,255,0.18)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#2f6bff,#19c6e6)\"><\u002Fspan><span style=\"font-size:18px;color:#2f6bff\">\u2197<\u002Fspan><\u002Fdiv>\n        <div><div style=\"font-family:'Sora',sans-serif;font-size:26px;font-weight:700;letter-spacing:-0.02em\">IROCAMM<\u002Fdiv><div style=\"font-size:15px;color:#6a6f99;margin-top:6px\">Publicaci\u00f3n prevista: 2028<\u002Fdiv><\u002Fdiv>\n      <\u002Fa>\n      <div style=\"border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:34px;background:#f2f5ff;border:1px solid #dfe6ff\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#2f6bff,#19c6e6)\"><\u002Fspan><\u002Fdiv>\n        <div><div style=\"font-family:'Sora',sans-serif;font-size:26px;font-weight:700;letter-spacing:-0.02em\">\u00c1mbitos<\u002Fdiv><div style=\"font-size:15px;color:#6a6f99;margin-top:6px\">Publicaci\u00f3n prevista: octubre 2027<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:34px;background:#f2f5ff;border:1px solid #dfe6ff\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"width:44px;height:44px;border-radius:12px;transform:rotate(45deg) scale(.8);background:linear-gradient(135deg,#2f6bff,#19c6e6)\"><\u002Fspan><\u002Fdiv>\n        <div><div style=\"font-family:'Sora',sans-serif;font-size:26px;font-weight:700;letter-spacing:-0.02em\">Intracom Journal<\u002Fdiv><div style=\"font-size:15px;color:#6a6f99;margin-top:6px\">Publicaci\u00f3n prevista: junio 2027 o enero 2028<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:16px;border-radius:22px;padding:26px 30px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:linear-gradient(90deg,#11123a,#1b2a8a);color:#ffffff\">\n      <div style=\"font-family:'Sora',sans-serif;font-size:19px;font-weight:600\">Libro colectivo en editorial de prestigio<\u002Fdiv>\n      <div style=\"font-size:15px;color:#c8ccf0;max-width:620px;line-height:1.55\">Para los trabajos que no superen la evaluaci\u00f3n de la revista. Si el n\u00famero de comunicaciones lo requiere, podr\u00e1 publicarse un monogr\u00e1fico conjunto con otros congresos.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"organizacion\" data-screen-label=\"Organizaci\u00f3n\" style=\"padding:100px 28px;background:#f2f5ff;color:#14163f\">\n  <div style=\"max-width:1240px;margin:0 auto\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#2f6bff;margin-bottom:16px\">06 \u2014 Equipo<\u002Fdiv>\n    <h2 style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(32px,4vw,52px);line-height:1.05;letter-spacing:-0.03em;margin:0 0 48px\">Organizaci\u00f3n<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:22px\">\n      <sc-for list=\"{{ committees }}\" as=\"c\" hint-placeholder-count=\"3\">\n        <div style=\"background:#ffffff;border-radius:24px;padding:clamp(22px,3vw,34px);box-shadow:0 8px 28px rgba(47,107,255,0.07)\">\n          <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:24px\"><span style=\"width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,#2f6bff,#19c6e6)\"><\u002Fspan><span style=\"font-family:'Sora',sans-serif;font-size:20px;font-weight:600\">{{ c.name }}<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6a6f99\">{{ c.count }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px 18px\">\n            <sc-for list=\"{{ c.people }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:center;gap:14px\">\n                <div style=\"width:58px;height:58px;flex:none;border-radius:50%;padding:2px;background:linear-gradient(135deg,#2f6bff,#19c6e6)\">\n                  <div style=\"width:100%;height:100%;border-radius:50%;overflow:hidden;background:#eaf0ff;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;font-size:17px;color:#2f6bff;border:2px solid #ffffff\">\n                    <sc-if value=\"{{ p.showImg }}\" hint-placeholder-val=\"{{ false }}\"><div role=\"img\" aria-label=\"{{ p.name }}\" style=\"{{ p.imgStyle }}\"><\u002Fdiv><\u002Fsc-if>\n                    <sc-if value=\"{{ p.showInitials }}\" hint-placeholder-val=\"{{ true }}\"><span>{{ p.initials }}<\u002Fspan><\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"min-width:0\"><div style=\"font-weight:600;font-size:16px;line-height:1.3;color:#14163f\">{{ p.name }}<\u002Fdiv><div style=\"font-size:14px;color:#6a6f99;line-height:1.35;margin-top:2px\">{{ p.org }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Entidades\" style=\"padding:70px 28px;background:#ffffff;color:#14163f;border-top:1px solid #e6ebff\">\n  <div style=\"max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:30px;align-items:center\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#2f6bff\">Entidades organizadoras<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:center\">\n      <img src=\"66f16428-fc80-4a41-96b2-b18c8cc60872\" alt=\"Universidad de M\u00e1laga\" style=\"max-height:80px;max-width:220px\">\n      <img src=\"6e8a26d1-e281-4a95-b4b6-54d434c09d6e\" alt=\"Universidad de Sevilla\" style=\"max-height:70px;max-width:200px\">\n      <img src=\"d9909d8a-c911-4ec0-9e61-e6b4fbf21c5f\" alt=\"Portal Intracom\" style=\"max-height:50px;max-width:230px\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"sede\" data-screen-label=\"Sede y contacto\" style=\"position:relative;padding:100px 28px;background:#11123a;overflow:hidden\">\n  <div style=\"position:absolute;bottom:-200px;right:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(25,198,230,0.3),rgba(25,198,230,0) 65%)\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:44px;align-items:stretch\">\n    <div style=\"display:flex;flex-direction:column;gap:24px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#4fd6f0\">07 \u2014 Sede<\u002Fdiv>\n      <h2 style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(32px,4vw,52px);line-height:1.05;letter-spacing:-0.03em;margin:0\">Sede y contacto<\u002Fh2>\n      <div style=\"font-size:17px;line-height:1.65;color:#c8ccf0\"><strong style=\"color:#ffffff;font-weight:600;display:block;font-size:19px;margin-bottom:6px\">Facultad de Ciencias de la Comunicaci\u00f3n<\u002Fstrong>Universidad de M\u00e1laga \u00b7 Campus de Teatinos<br>29010 M\u00e1laga (Espa\u00f1a)<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <a href=\"mailto:info@intracom.es\" style=\"display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;background:rgba(47,107,255,0.16);border:1px solid rgba(79,214,240,0.25);color:#ffffff;font-size:16px\" style-hover=\"border-color:#4fd6f0;color:#ffffff\"><span style=\"width:10px;height:10px;border-radius:3px;background:#19c6e6\"><\u002Fspan>info@intracom.es<\u002Fa>\n        <a href=\"tel:+34613700907\" style=\"display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;background:rgba(47,107,255,0.16);border:1px solid rgba(79,214,240,0.25);color:#ffffff;font-size:16px\" style-hover=\"border-color:#4fd6f0;color:#ffffff\"><span style=\"width:10px;height:10px;border-radius:3px;background:#2f6bff\"><\u002Fspan>+34 613 700 907<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-radius:28px;min-height:340px;padding:2px;background:linear-gradient(135deg,#2f6bff,#19c6e6)\"><img src=\"8bb9b6e3-77a3-4522-892c-3e0bfbfb7cf6\" alt=\"Facultad de Ciencias de la Comunicaci\u00f3n, Universidad de M\u00e1laga\" style=\"width:100%;height:100%;min-height:336px;object-fit:cover;border-radius:26px;display:block\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Portal Intracom\" style=\"padding:90px 28px;background:#ffffff;color:#14163f\">\n  <div style=\"max-width:1240px;margin:0 auto;position:relative;border-radius:32px;overflow:hidden;background:linear-gradient(120deg,#11123a 0%,#1b2a8a 55%,#2f6bff 100%);color:#ffffff;padding:clamp(32px,5vw,64px)\">\n    <div style=\"position:absolute;inset:0;background-image:linear-gradient(rgba(143,240,255,0.12) 1px,transparent 1px),linear-gradient(90deg,rgba(143,240,255,0.12) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(90deg,transparent 30%,#000);-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000)\"><\u002Fdiv>\n    <div style=\"position:absolute;right:-120px;bottom:-160px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(25,198,230,0.45),rgba(25,198,230,0) 65%)\"><\u002Fdiv>\n    <div style=\"position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:40px;align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <a href=\"https://portalintracom.com/\" style=\"align-self:flex-start;background:#ffffff;border-radius:16px;padding:14px 22px;display:flex;box-shadow:0 10px 30px rgba(8,10,40,0.35)\"><img src=\"d9909d8a-c911-4ec0-9e61-e6b4fbf21c5f\" alt=\"Portal Intracom\" style=\"height:44px;width:auto;display:block\"><\u002Fa>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#4fd6f0\">Un congreso de Portal Intracom<\u002Fdiv>\n        <h2 style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(30px,3.8vw,48px);line-height:1.05;letter-spacing:-0.03em;margin:0;text-wrap:balance\">Conectando la ciencia con la sociedad<\u002Fh2>\n        <p style=\"margin:0;font-size:18px;line-height:1.65;color:#d6dcff;max-width:600px;text-wrap:pretty\">Portal Intracom es un portal iberoamericano para la transferencia del conocimiento acad\u00e9mico y la divulgaci\u00f3n cient\u00edfica: un campus expandido, sin fronteras f\u00edsicas, donde investigadores, profesionales, instituciones y empresas se conectan, comparten experiencias y generan sinergias.<\u002Fp>\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:6px\">\n          <a href=\"https://portalintracom.com/\" style=\"background:#ffffff;color:#2f6bff;padding:16px 28px;border-radius:999px;font-weight:600;font-size:15px;box-shadow:0 10px 30px rgba(8,10,40,0.35)\" style-hover=\"background:#4fd6f0;color:#11123a\">Conoce Portal Intracom \u2192<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:grid;grid-template-columns:44px 1fr;gap:16px;align-items:center;padding:18px 20px;border-radius:18px;background:rgba(17,18,58,0.45);border:1px solid rgba(143,240,255,0.25);backdrop-filter:blur(6px)\"><span style=\"width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#2f6bff,#19c6e6);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:13px\">01<\u002Fspan><div style=\"font-size:16px;line-height:1.45\"><strong style=\"display:block;font-family:'Sora',sans-serif;font-weight:600\">Visibilizar el talento<\u002Fstrong><span style=\"color:#c8ccf0\">que se genera en el \u00e1mbito acad\u00e9mico y profesional.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:44px 1fr;gap:16px;align-items:center;padding:18px 20px;border-radius:18px;background:rgba(17,18,58,0.45);border:1px solid rgba(143,240,255,0.25);backdrop-filter:blur(6px)\"><span style=\"width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#2f6bff,#19c6e6);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:13px\">02<\u002Fspan><div style=\"font-size:16px;line-height:1.45\"><strong style=\"display:block;font-family:'Sora',sans-serif;font-weight:600\">Transferir el conocimiento<\u002Fstrong><span style=\"color:#c8ccf0\">a la sociedad, favoreciendo su aplicaci\u00f3n en contextos reales.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:44px 1fr;gap:16px;align-items:center;padding:18px 20px;border-radius:18px;background:rgba(17,18,58,0.45);border:1px solid rgba(143,240,255,0.25);backdrop-filter:blur(6px)\"><span style=\"width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#2f6bff,#19c6e6);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:13px\">03<\u002Fspan><div style=\"font-size:16px;line-height:1.45\"><strong style=\"display:block;font-family:'Sora',sans-serif;font-weight:600\">Abierto a instituciones y empresas<\u002Fstrong><span style=\"color:#c8ccf0\">Cualquier entidad p\u00fablica o privada puede adherirse al portal.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"padding:60px 28px 36px;background:linear-gradient(110deg,#1b2a8a,#2f6bff 60%,#19a3d6)\">\n  <div style=\"max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:36px\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <img src=\"2339d2ab-087a-4b4e-84da-5a41a19234e5\" alt=\"AIEthics\" style=\"height:38px;width:auto;align-self:flex-start\">\n      <p style=\"margin:0;font-size:14px;line-height:1.6;color:#e6ecff\">AIETHICS es un congreso coorganizado por la Universidad de M\u00e1laga, la Universidad de Sevilla y el Portal Iberoamericano de la Transferencia Intracom.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#ffffff;margin-bottom:4px\">Men\u00fa<\u002Fdiv>\n      <a href=\"#lineas\" style=\"color:#e6ecff\" style-hover=\"color:#ffffff\">L\u00edneas tem\u00e1ticas<\u002Fa>\n      <a href=\"#participa\" style=\"color:#e6ecff\" style-hover=\"color:#ffffff\">Call for papers<\u002Fa>\n      <a href=\"#inscripcion\" style=\"color:#e6ecff\" style-hover=\"color:#ffffff\">Inscripci\u00f3n<\u002Fa>\n      <a href=\"#publicaciones\" style=\"color:#e6ecff\" style-hover=\"color:#ffffff\">Publicaciones<\u002Fa>\n      <a href=\"/2026/\" style=\"color:#4fd6f0\" style-hover=\"color:#ffffff\">AIETHICS 2026 \u00b7 edici\u00f3n anterior<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px;color:#e6ecff;line-height:1.55\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#ffffff;margin-bottom:4px\">Contacto<\u002Fdiv>\n      <span>Facultad de Ciencias de la Comunicaci\u00f3n<br>Universidad de M\u00e1laga<\u002Fspan>\n      <a href=\"mailto:info@intracom.es\" style=\"color:#ffffff\" style-hover=\"color:#11123a\">info@intracom.es<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1240px;margin:44px auto 0;padding-top:22px;border-top:1px solid rgba(255,255,255,0.25);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:#e6ecff\">\n    <span>AIETHICS \u00a9 2026. Todos los derechos reservados.<\u002Fspan>\n    <div style=\"display:flex;gap:18px;flex-wrap:wrap\"><a href=\"#\" style=\"color:#e6ecff\" style-hover=\"color:#ffffff\">Pol\u00edtica de privacidad<\u002Fa><a href=\"#\" style=\"color:#e6ecff\" style-hover=\"color:#ffffff\">Aviso legal<\u002Fa><a href=\"#\" style=\"color:#e6ecff\" style-hover=\"color:#ffffff\">Cookies<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showCountdown&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Hero&quot;},&quot;committeePhotos&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Organizaci\u00f3n&quot;}}\">\nconst U = 'https://aiethics.portalintracom.com/wp-content/uploads/';\nconst LINES = [\n  { title: 'Inteligencia artificial y transformaci\u00f3n del periodismo: narrativas, credibilidad y democracia', desc: 'La inteligencia artificial ha incidido de forma transversal en la producci\u00f3n informativa, reconfigurando rutinas, procesos y criterios profesionales en el \u00e1mbito period\u00edstico. Esta l\u00ednea propone analizar su impacto en la generaci\u00f3n de contenidos, con nuevas posibilidades en la edici\u00f3n, la gesti\u00f3n de fuentes y el dise\u00f1o narrativo. Asimismo, se abordar\u00e1n sus implicaciones en la expansi\u00f3n de la desinformaci\u00f3n y en los procesos de polarizaci\u00f3n y, por extensi\u00f3n, en la calidad del debate p\u00fablico y la salud democr\u00e1tica, as\u00ed como la creciente necesidad de promover la alfabetizaci\u00f3n algor\u00edtmica de la ciudadan\u00eda. Finalmente, se invita a presentar investigaciones centradas en la transformaci\u00f3n de las empresas period\u00edsticas a causa de la integraci\u00f3n de la IA.', subs: ['Inteligencia artificial y transformaci\u00f3n de las rutinas profesionales del periodismo.', 'IA generativa, narrativas period\u00edsticas y nuevos formatos informativos.', 'IA, desinformaci\u00f3n y polarizaci\u00f3n.', 'Alfabetizaci\u00f3n algor\u00edtmica, confianza en los medios y colectivos vulnerables.', 'Periodismo de datos, verificaci\u00f3n y fact-checking automatizado.', 'Transformaci\u00f3n de la empresa period\u00edstica. Retos y nuevas posibilidades de negocio.'] },\n  { title: 'Inteligencia artificial y comunicaci\u00f3n audiovisual: creaci\u00f3n, derechos y confianza', desc: 'Esta l\u00ednea analizar\u00e1 el uso de la inteligencia artificial en la creaci\u00f3n, producci\u00f3n, distribuci\u00f3n y consumo de contenidos audiovisuales. Se abordar\u00e1n sus efectos sobre la autor\u00eda, el trabajo creativo, la representaci\u00f3n de personas y grupos sociales y la confianza de las audiencias. Tambi\u00e9n se estudiar\u00e1n las responsabilidades de productoras, medios, plataformas y creadores ante la generaci\u00f3n o manipulaci\u00f3n de im\u00e1genes, voces y v\u00eddeos.', subs: ['Aplicaciones de la IA en el guion, la producci\u00f3n, el montaje, los efectos visuales, el doblaje y la posproducci\u00f3n.', 'Autor\u00eda, derechos de propiedad intelectual y uso de obras audiovisuales para el entrenamiento de modelos.', 'Clonaci\u00f3n de voces y r\u00e9plicas digitales de int\u00e9rpretes: consentimiento, remuneraci\u00f3n y control sobre la propia imagen.', 'Contenidos sint\u00e9ticos y deepfakes: etiquetado, trazabilidad, verificaci\u00f3n y responsabilidad editorial.', 'Sesgos, estereotipos y representaci\u00f3n de g\u00e9nero, origen, edad, discapacidad y diversidad cultural.', 'Algoritmos de recomendaci\u00f3n y distribuci\u00f3n: pluralismo, visibilidad de las obras y concentraci\u00f3n de la oferta.', 'IA aplicada a la accesibilidad audiovisual: subtitulado, audiodescripci\u00f3n, doblaje y traducci\u00f3n autom\u00e1tica.', 'Transformaci\u00f3n de los perfiles profesionales, condiciones laborales y formaci\u00f3n en el sector audiovisual.', 'Recepci\u00f3n de contenidos generados con IA, confianza del p\u00fablico y alfabetizaci\u00f3n audiovisual.', 'Uso de la IA en archivos, restauraci\u00f3n y recreaci\u00f3n de im\u00e1genes hist\u00f3ricas: l\u00edmites documentales y \u00e9ticos.'] },\n  { title: 'Inteligencia artificial y publicidad: creatividad, derechos y audiencias', desc: 'La inteligencia artificial est\u00e1 modificando la creaci\u00f3n, planificaci\u00f3n, difusi\u00f3n y evaluaci\u00f3n de las campa\u00f1as publicitarias. Esta l\u00ednea propone analizar las posibilidades que ofrecen estas herramientas para producir contenidos, personalizar mensajes y automatizar procesos, sin dejar de atender a sus efectos sobre la creatividad, la privacidad y la autonom\u00eda de las audiencias. Tambi\u00e9n se abordar\u00e1n la atribuci\u00f3n de responsabilidades, la protecci\u00f3n de los derechos de autor y de imagen, los sesgos presentes en la segmentaci\u00f3n y la transformaci\u00f3n del trabajo en agencias, medios y departamentos de comunicaci\u00f3n.', subs: ['Creaci\u00f3n publicitaria asistida por IA: posibilidades, limitaciones y nuevos formatos.', 'Personalizaci\u00f3n de mensajes, segmentaci\u00f3n de p\u00fablicos y planificaci\u00f3n automatizada de medios.', 'Autor\u00eda, propiedad intelectual y uso de obras protegidas para entrenar modelos generativos.', 'Influencers virtuales, clonaci\u00f3n de voces y r\u00e9plicas digitales: identidad, consentimiento y derechos de imagen.', 'Transparencia de los contenidos generados mediante IA, persuasi\u00f3n automatizada y confianza de las audiencias.', 'Sesgos, representaci\u00f3n social y transformaci\u00f3n de los perfiles profesionales y los procesos de trabajo.'] },\n  { title: 'Inteligencia artificial y transformaci\u00f3n de las relaciones p\u00fablicas: estrategia, reputaci\u00f3n y confianza', desc: 'La inteligencia artificial est\u00e1 transformando la investigaci\u00f3n, planificaci\u00f3n y evaluaci\u00f3n de las relaciones p\u00fablicas, as\u00ed como la comunicaci\u00f3n entre las organizaciones p\u00fablicas y privadas y sus interlocutores. Esta l\u00ednea propone estudiar sus aplicaciones en el an\u00e1lisis de conversaciones, la producci\u00f3n de contenidos, la atenci\u00f3n automatizada y la gesti\u00f3n de la reputaci\u00f3n. Se prestar\u00e1 atenci\u00f3n a la transparencia, la privacidad, los sesgos y la responsabilidad profesional, especialmente cuando la automatizaci\u00f3n pueda afectar a la confianza o dificultar la identificaci\u00f3n del origen de los mensajes.', subs: ['Aplicaciones de la IA en la investigaci\u00f3n, planificaci\u00f3n y evaluaci\u00f3n de estrategias de relaciones p\u00fablicas.', 'Escucha social, an\u00e1lisis de p\u00fablicos y detecci\u00f3n automatizada de tendencias y riesgos reputacionales.', 'Chatbots, asistentes virtuales y personalizaci\u00f3n de la comunicaci\u00f3n con los p\u00fablicos.', 'Gesti\u00f3n de crisis, desinformaci\u00f3n y protecci\u00f3n de la reputaci\u00f3n mediante herramientas de IA.', 'Transparencia, autenticidad y atribuci\u00f3n de responsabilidades en la comunicaci\u00f3n automatizada.', 'Transformaci\u00f3n de las agencias, los departamentos de comunicaci\u00f3n y los perfiles profesionales.'] },\n  { title: 'Marco regulatorio y debate \u00e9tico sobre la IA', desc: 'El desarrollo acelerado de la inteligencia artificial est\u00e1 generando un intenso debate en torno a los marcos normativos y los principios \u00e9ticos que deben guiar su implementaci\u00f3n en el ecosistema comunicativo. Esta l\u00ednea aborda las tensiones entre innovaci\u00f3n y regulaci\u00f3n, as\u00ed como los desaf\u00edos asociados a la transparencia, la rendici\u00f3n de cuentas y la protecci\u00f3n de derechos fundamentales en contextos de automatizaci\u00f3n informativa. Desde una perspectiva multidisciplinar, se analizar\u00e1n los l\u00edmites y oportunidades de la gobernanza de la IA en comunicaci\u00f3n, prestando especial atenci\u00f3n a fen\u00f3menos como la desinformaci\u00f3n, los sesgos algor\u00edtmicos y la opacidad de los sistemas automatizados, en un contexto en el que las pol\u00edticas p\u00fablicas buscan equilibrar competitividad, seguridad y calidad democr\u00e1tica.', subs: ['Gobernanza de la inteligencia artificial en el ecosistema medi\u00e1tico: regulaci\u00f3n europea, empresas tecnol\u00f3gicas.', '\u00c9tica de los sistemas automatizados: transparencia, sesgos algor\u00edtmicos y responsabilidad.', 'Impacto de la IA en los derechos fundamentales y la salud mental: libertad de expresi\u00f3n, privacidad y acceso a la informaci\u00f3n.', 'Desinformaci\u00f3n, deepfakes y manipulaci\u00f3n informativa a trav\u00e9s de las redes sociales: an\u00e1lisis de casos y retos regulatorios.', 'Protecci\u00f3n de datos y uso de fuentes en sistemas de IA: tratamiento de datos personales, scraping, derechos de autor y uso de contenidos period\u00edsticos para entrenar modelos.', 'Certificaci\u00f3n, est\u00e1ndares y buenas pr\u00e1cticas en IA aplicada al periodismo: iniciativas para garantizar calidad, integridad y confianza en el uso de estas tecnolog\u00edas.'] }\n];\nconst RES = window.__resources || {};\nconst P = (name, org, img) => ({ name, org, img: img ? (RES['r_' + img.replace(/[^a-zA-Z0-9]/g, '_')] || U + img) : '' });\nconst COMMITTEES = [\n  { name: 'Comit\u00e9 de Honor', people: [P('Bella Palomo', 'Decana de la Facultad de Ciencias de la Comunicaci\u00f3n (UMA)', '2025/01/23_resultado.webp'), P('Sim\u00f3n Pe\u00f1a', 'Catedr\u00e1tico de Periodismo (UPV/EHU) \u00b7 Co-IP del grupo Gureiker')] },\n  { name: 'Comit\u00e9 de Direcci\u00f3n', people: [P('Sonia Blanco Ruiz', 'Universidad de M\u00e1laga', '2025/01/13_resultado.webp'), P('Laura Teruel Rodr\u00edguez', 'Universidad de M\u00e1laga'), P('Ar\u00e1nzazu Rom\u00e1n San Miguel', 'Universidad de Sevilla', '2025/01/8_resultado.webp')] },\n  { name: 'Comit\u00e9 de Organizaci\u00f3n', people: [P('Francisco J. Olivares Garc\u00eda', 'Universidad de Sevilla', '2025/01/25_resultado.webp'), P('Marta S\u00e1nche  'rgba(47,107,255,0.22)', color: on ? '#ffffff' : '#4fd6f0' }\n      };\n    });\n    const L = LINES[a];\n    const committees = COMMITTEES.map(c => ({ name: c.name, count: c.people.length > 1 ? c.people.length + ' miembros' : '', people: c.people.map(p => {\n      const showImg = photos && !!p.img;\n      return { ...p, showImg, showInitials: !showImg, initials: initials(p.name), imgStyle: { width: '100%', height: '100%', backgroundImage: p.img ? `url(\"${p.img}\")` : 'none', backgroundSize: 'cover', backgroundPosition: 'center' } };\n    }) }));\n    const days = Math.max(0, Math.ceil((new Date('2027-02-08T23:59:00') - new Date()) / 86400000));\n    if (!this._ring) {\n      const h = React.createElement, N = 30, R = 120, D = 150;\n      const discs = Array.from({ length: N }, (_, i) => {\n        const a = (360 / N) * i;\n        return h('div', { key: i, style: { position: 'absolute', left: '50%', top: '50%', width: 0, height: 0, transformStyle: 'preserve-3d', transform: `rotateZ(${a}deg) translateX(${R}px) rotateX(90deg)` } },\n          h('div', { style: { position: 'absolute', left: -D / 2, top: -D / 2, width: D, height: D, borderRadius: '50%', transformStyle: 'preserve-3d', animation: `discwave 4.8s ease-in-out ${(-i * 4.8 / N).toFixed(2)}s infinite`, background: `linear-gradient(${140 + i * 6}deg,#8ff0ff 0%,#4f8dff 28%,#1c1fb0 58%,#0d0f6e 72%,#8a6cff 100%)`, border: '3px solid rgba(150,225,255,0.95)', boxShadow: 'inset 0 0 18px rgba(120,240,255,0.55)', opacity: 0.94 } }));\n      });\n      this._ring = h('div', { style: { width: 420, height: 420, perspective: 1100, display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none', transform: 'scale(var(--rs,1))' } },\n        h('div', { style: { position: 'relative', width: 300, height: 300, transformStyle: 'preserve-3d', animation: 'ringspin 26s linear infinite' } }, discs));\n    }\n    if (!this._hero) {\n      const h = React.createElement, S = 280, L = 6, GAP = 52;\n      const line = 'rg
